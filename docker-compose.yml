services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: postgres_dev
      POSTGRES_USER: dev_user
      POSTGRES_PASSWORD: dev_password
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dev_user -d postgres_dev"]
      interval: 5s
      timeout: 3s
      retries: 10
volumes:
  pgdata:
